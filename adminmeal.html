<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Menu - OBC Mess Admin</title>
    
    <!-- 🔥 PWA & PREMIUM META TAGS 🔥 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f6f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OBC Mess">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        /* ================= PREMIUM BASE STYLES ================= */
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --success: #34C759; --danger: #FF3B30; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 120px; }

        /* Loader */
        #app-loader { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;}
        .spinner { border: 4px solid rgba(0, 122, 255, 0.2); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Sticky Header */
        .header { padding: 25px 20px 20px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(244,246,249,0.95); backdrop-filter: blur(15px); z-index: 50; border-bottom: 1px solid rgba(0,0,0,0.03);}
        .header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;}
        .btn-save { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 14px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 6px 15px rgba(0,122,255,0.3); transition: 0.2s;}
        .btn-save:active { transform: scale(0.95); box-shadow: 0 3px 8px rgba(0,122,255,0.2);}

        /* Info Banner */
        .info-banner { background: rgba(0,122,255,0.1); color: var(--primary); margin: 20px; padding: 16px 20px; border-radius: 16px; font-size: 13px; font-weight: 700; line-height: 1.4; border: 1px solid rgba(0,122,255,0.15); display: flex; align-items: center;}
        .info-banner span { font-size: 20px; margin-right: 12px;}

        /* Day Cards */
        .day-card { background: var(--card-bg); margin: 0 20px 20px 20px; border-radius: 24px; box-shadow: 0 8px 25px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); overflow: hidden;}
        .day-header { background: linear-gradient(135deg, #1c1c1e, #2c2c2e); color: #fff; padding: 18px 20px; font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;}
        .day-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
        
        /* Inputs */
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; letter-spacing: 0.5px;}
        .input-group label span { font-size: 18px; margin-right: 8px;}
        .menu-input { padding: 16px 20px; border-radius: 16px; border: 2px solid transparent; background: #f4f6f9; font-size: 14px; font-weight: 700; color: var(--text-main); outline: none; transition: 0.2s; font-family: inherit;}
        .menu-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 4px 15px rgba(0,122,255,0.1);}

        /* 🔥 NEW 5-TAB BOTTOM NAV 🔥 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 12px 5px 25px 5px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 800; cursor: pointer; text-decoration: none; transition: 0.2s; flex: 1;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; transition: transform 0.2s;}
        .nav-item:active .nav-icon { transform: scale(0.8); }
    </style>
</head>
<body>

    <div id="app-loader">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <h1>Update Menu</h1>
        <button class="btn-save" id="btn-save" onclick="saveMenu()">💾 Save Live</button>
    </div>

    <div class="info-banner">
        <span>🔄</span> Edit any item below and click Save. Students will see the new menu instantly!
    </div>

    <div id="menu-container">
        <!-- Day Cards will be generated here by JavaScript automatically -->
    </div>

    <!-- 🔥 5-TAB BOTTOM NAV 🔥 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div><span>Home</span>
        </a>
        <a href="add.html" class="nav-item">
            <div class="nav-icon">➕</div><span>Add</span>
        </a>
        <a href="notification.html" class="nav-item">
            <div class="nav-icon">🔔</div><span>Alerts</span>
        </a>
        <a href="adminmeal.html" class="nav-item active">
            <div class="nav-icon">🍽️</div><span>Menu</span>
        </a>
        <a href="setting.html" class="nav-item">
            <div class="nav-icon">⚙️</div><span>Settings</span>
        </a>
    </div>

<script>
    // Firebase Configuration
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // Arrays for generating UI dynamically
    const days = [
        { id: "mon", name: "Monday Routine" }, 
        { id: "tue", name: "Tuesday Routine" }, 
        { id: "wed", name: "Wednesday Routine" },
        { id: "thu", name: "Thursday Routine" }, 
        { id: "fri", name: "Friday Routine" }, 
        { id: "sat", name: "Saturday Routine" },
        { id: "sun", name: "Sunday Routine" }
    ];

    // 🔥 DEFAULT OBC PAPER MENU EXTRACTED FROM IMAGE 🔥
    const menuDefaults = {
        mon_b: "VEGETABLE DALIYA, TEA", 
        mon_l: "RAJMA AALU, DAL TADKA, RICE, ROTI, SALAD", 
        mon_d: "SEASONAL VEG, DAL FRY, RICE, ROTI, ACHAR",
        
        tue_b: "POHA MASALA, TEA", 
        tue_l: "AALU CHOLE MASALA, MUNG DAL, RICE, ROTI, SALAD", 
        tue_d: "SEASONAL VEG, BLACK MASOOR DAL, RICE, ROTI, ACHAR",
        
        wed_b: "PASTA, TEA", 
        wed_l: "LAUKI CHANA DAL, JERA ALOO, RICE, ROTI, SALAD", 
        wed_d: "SEASONAL VEG, MIX DAL, RICE, ROTI, ACHAR",
        
        thu_b: "AALU PURI, TEA", 
        thu_l: "MIX VEG, DAL TADKA, RICE, ROTI, SALAD", 
        thu_d: "MATAR AALU, MOONG CHILKA DAL, RICE, ROTI, ACHAR",
        
        fri_b: "PARATHA, TEA", 
        fri_l: "AALU TAMATAR, DAL TADKA, RICE, ROTI, SALAD", 
        fri_d: "SEASONAL VEG, MIX DAL, RICE, ROTI, ACHAR",
        
        sat_b: "BHAJIYA, TEA", 
        sat_l: "KADHI PAKODA, JIRA AALU, RICE, ROTI, SALAD", 
        sat_d: "AALU SOYA BEAN, MOONG DAL, RICE, ROTI, ACHAR",
        
        sun_b: "BLACK CHANA FRY, TEA, HALWA", 
        sun_l: "VEG BIRYANI, VEG RAITA, ROTI, SALAD", 
        sun_d: "MATAR PANNER, POORI, ACHAR, GULABJAMUN/KHEER or SAWAI"
    };

    // Generate Inputs Automatically
    const container = document.getElementById("menu-container");
    days.forEach(day => {
        container.innerHTML += `
            <div class="day-card">
                <div class="day-header">${day.name}</div>
                <div class="day-body">
                    <div class="input-group">
                        <label><span>🌅</span> Breakfast</label>
                        <input type="text" id="${day.id}_b" class="menu-input" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label><span>☀️</span> Lunch</label>
                        <input type="text" id="${day.id}_l" class="menu-input" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label><span>🌙</span> Dinner</label>
                        <input type="text" id="${day.id}_d" class="menu-input" autocomplete="off">
                    </div>
                </div>
            </div>
        `;
    });

    // 🔥 SMART AUTH CHECK (TO PREVENT LOGIN LOOP) 🔥
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is logged in, proceed safely
            loadMenu();
        } else {
            // Wait 1 second before redirecting. Firebase sometimes takes a split second to verify session.
            setTimeout(() => {
                if (!auth.currentUser) {
                    window.location.replace("login.html");
                }
            }, 1000);
        }
    });

    // Load Menu Data
    function loadMenu() {
        db.collection("config").doc("weekly_menu").get().then((doc) => {
            let dbData = doc.exists ? doc.data() : {};
            
            // System check karega: Agar database mein custom menu hai toh wo dikhayega, warna Paper wala default set kar dega.
            days.forEach(day => {
                document.getElementById(`${day.id}_b`).value = dbData[`${day.id}_b`] || menuDefaults[`${day.id}_b`];
                document.getElementById(`${day.id}_l`).value = dbData[`${day.id}_l`] || menuDefaults[`${day.id}_l`];
                document.getElementById(`${day.id}_d`).value = dbData[`${day.id}_d`] || menuDefaults[`${day.id}_d`];
            });
            
            document.getElementById("app-loader").style.display = "none";
        }).catch(err => {
            alert("Error loading menu: " + err.message);
            document.getElementById("app-loader").style.display = "none";
        });
    }

    // Save Live Menu to Firestore
    function saveMenu() {
        let btn = document.getElementById("btn-save");
        btn.innerText = "⏳ Saving..."; 
        btn.disabled = true;

        let menuData = {};
        days.forEach(day => {
            menuData[`${day.id}_b`] = document.getElementById(`${day.id}_b`).value.trim();
            menuData[`${day.id}_l`] = document.getElementById(`${day.id}_l`).value.trim();
            menuData[`${day.id}_d`] = document.getElementById(`${day.id}_d`).value.trim();
        });

        db.collection("config").doc("weekly_menu").set(menuData, {merge: true}).then(() => {
            alert("✅ Routine Updated! Students can now see the live menu.");
            btn.innerText = "💾 Save Live"; 
            btn.disabled = false;
        }).catch(err => {
            alert("Error saving: " + err.message);
            btn.innerText = "💾 Save Live"; 
            btn.disabled = false;
        });
    }
</script>

<!-- 🔥 REGISTER SERVICE WORKER 🔥 -->
<script>
    if ('serviceWorker' in navigator) { 
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('sw.js'); 
        }); 
    }
</script>
</body>
</html>
