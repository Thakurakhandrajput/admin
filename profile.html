<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBC Mess - Profile</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        /* ================= PREMIUM BASE STYLES ================= */
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --danger: #FF3B30; --success: #34C759; --warning: #FF9500; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 40px; }
        body.modal-open { overflow: hidden; overscroll-behavior-y: none; }

        /* ================= HEADER & PROFILE INFO ================= */
        .header { background: var(--card-bg); padding: 50px 20px 30px 20px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); position: relative; }
        .btn-back { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; cursor: pointer; text-decoration: none; color: var(--text-main); padding: 5px;}
        .btn-edit { position: absolute; top: 20px; right: 20px; font-size: 22px; cursor: pointer; background: var(--bg-color); padding: 8px; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.2s;}
        .btn-edit:active { transform: scale(0.9); }
        
        .profile-pic { width: 120px; height: 120px; border-radius: 35px; object-fit: cover; margin-bottom: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border: 4px solid #fff; }
        .profile-name { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .profile-room { margin: 5px 0 15px 0; color: var(--text-muted); font-size: 14px; font-weight: 600; }
        
        .badge-main { display: inline-block; padding: 8px 20px; background: #1c1c1e; color: #fff; border-radius: 20px; font-weight: 700; font-size: 14px; margin-bottom: 20px; }
        .expired { background: var(--danger); } 
        .paused-badge { background: var(--primary); }

        /* BUTTON ROW */
        .action-buttons { display: flex; gap: 10px; padding: 0 20px; justify-content: center; }
        .btn-pause { flex: 1; background: var(--primary); color: #fff; border: none; padding: 16px 10px; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(0,122,255,0.25); transition: 0.2s;}
        .btn-pause:active { transform: scale(0.97); }
        .btn-history { flex: 1; background: #1c1c1e; color: #fff; border: none; padding: 16px 10px; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); transition: 0.2s;}
        .btn-history:active { transform: scale(0.97); }

        /* ================= CALENDAR ================= */
        .calendar-card { background: var(--card-bg); margin: 20px; border-radius: 24px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
        .cal-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; color: var(--text-main); }
        .cal-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f0f0f0; align-items: center; }
        .cal-date { font-weight: 700; font-size: 14px; width: 65px; color: var(--text-muted); }
        .meal-dots { display: flex; gap: 8px; }
        .dot { padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; }
        .dot.yes { background: rgba(52, 199, 89, 0.15); color: var(--success); }
        .dot.no { background: rgba(255, 59, 48, 0.15); color: var(--danger); }
        .dot.pause { background: rgba(0, 122, 255, 0.15); color: var(--primary); } 
        .dot.due { background: rgba(255, 152, 0, 0.15); color: #ff9800; }

        /* ================= BOTTOM SHEETS ================= */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(3px);}
        .bottom-sheet-overlay.active { opacity: 1; visibility: visible; }
        
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-radius: 30px 30px 0 0; padding: 0px 0px 20px 0px; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 1001; max-height: 90vh; display: flex; flex-direction: column;}
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }
        
        .sheet-header { padding: 15px 25px 15px 25px; background: var(--card-bg); border-radius: 30px 30px 0 0; position: sticky; top: 0; z-index: 10; touch-action: none; border-bottom: 1px solid rgba(0,0,0,0.05);}
        .drag-handle-area { width: 100%; height: 20px; display: flex; justify-content: center; align-items: flex-start; cursor: grab; padding-top: 5px; margin-bottom: 5px;}
        .drag-handle { width: 45px; height: 5px; background: #d1d1d6; border-radius: 5px; }
        .sheet-title { font-size: 20px; font-weight: 800; text-align: center; color: var(--text-main); margin: 0; }
        
        .sheet-content { padding: 15px 25px; overflow-y: auto; flex-grow: 1; overscroll-behavior: contain; }

        /* FORM INPUTS */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px;}
        .input-group input, .input-group select { width: 100%; background: var(--bg-color); border: 2px solid transparent; padding: 16px; border-radius: 14px; font-size: 15px; outline: none; font-weight: 600; color: var(--text-main); transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); background: #fff; }
        
        .upload-btn { background: rgba(0, 122, 255, 0.08); border: 2px dashed var(--primary); padding: 16px; border-radius: 14px; text-align: center; color: var(--primary); font-weight: 700; position: relative; margin-bottom: 5px;}
        .upload-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;}
        
        .btn-main { width: 100%; background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px;}
        .btn-main:active { transform: scale(0.97); }
        .btn-danger { background: transparent; color: var(--danger); border: 2px solid var(--danger); margin-top: 15px;}
        .btn-danger:active { background: rgba(255, 59, 48, 0.1); }

        /* PAYMENT HISTORY CARD */
        .pay-card { background:#f9f9f9; padding:18px; border-radius:18px; margin-bottom:12px; border:1px solid #f0f0f0; }
        .pay-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .pay-amt { font-size: 20px; font-weight: 800; color: var(--success); }
        .pay-mode { font-size: 12px; font-weight: 700; background: #e5e5ea; padding: 4px 10px; border-radius: 8px; color: var(--text-main); text-transform: uppercase;}
        .pay-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }
        .pay-row strong { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="header" id="profile-header" style="display: none;">
        <a href="index.html" class="btn-back">❮</a>
        <div class="btn-edit" onclick="openSheet('edit-sheet')">✏️</div>
        
        <img id="prof-img" class="profile-pic" src="">
        <h2 id="prof-name" class="profile-name">Loading...</h2>
        <p id="prof-room" class="profile-room">Room: - | Code: -</p>
        
        <div id="prof-days" class="badge-main">Loading...</div>
        
        <div class="action-buttons">
            <button id="btn-pause" class="btn-pause" onclick="togglePause()">⏸️ Pause</button>
            <button class="btn-history" onclick="openPaymentHistory()">💳 History</button>
        </div>
    </div>

    <div class="calendar-card">
        <div class="cal-title">📅 Meal History (This Month)</div>
        <div id="cal-body">
            <div style="text-align:center; padding: 20px; color:#888;">Fetching...</div>
        </div>
    </div>

    <!-- PREMIUM EDIT POPUP (Bottom Sheet) -->
    <div id="edit-sheet" class="bottom-sheet-overlay" onclick="closeSheetOutside(event, 'edit-sheet')">
        <div class="bottom-sheet" id="edit-sheet-content">
            <div class="sheet-header" id="edit-header">
                <div class="drag-handle-area"><div class="drag-handle"></div></div>
                <div class="sheet-title">Edit & Extend</div>
            </div>
            
            <div class="sheet-content">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="input-group"><label>Full Name</label><input type="text" id="edit-name"></div>
                    <div class="input-group"><label>Room No</label><input type="text" id="edit-room"></div>
                </div>

                <div class="input-group">
                    <label>Update Photo</label>
                    <div class="upload-btn">
                        <span id="edit-file-name">📸 Tap to Change Photo</span>
                        <input type="file" id="edit-photo" accept="image/*" capture="environment" onchange="previewFile('edit-photo', 'edit-file-name')">
                    </div>
                </div>

                <hr style="border:none; border-top:1px dashed #ddd; margin:20px 0;">
                <p style="font-size:14px; font-weight:800; margin:0 0 15px 0;">💸 Extend Validity & Payment</p>

                <div class="input-group"><label>Extend Fee Valid Till</label><input type="date" id="edit-date"></div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="input-group">
                        <label>New Payment (₹)</label>
                        <input type="number" id="edit-pay-amt" placeholder="Amount (e.g. 2500)">
                    </div>
                    <div class="input-group">
                        <label>Pay Mode</label>
                        <select id="edit-pay-mode">
                            <option value="Cash">💵 Cash</option>
                            <option value="Online">📱 Online</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Account Status</label>
                    <select id="edit-status">
                        <option value="active">🟢 Active</option>
                        <option value="fee_due">🟠 Fee Due</option>
                        <option value="paused">⏸️ Paused</option>
                        <option value="banned">🔴 Banned</option>
                    </select>
                </div>
                
                <button type="button" class="btn-main" id="btn-save" onclick="updateProfile()">💾 Save Changes & Payment</button>
                <button type="button" class="btn-main btn-danger" id="btn-del" onclick="deleteStudent()">🗑️ Delete Student</button>
            </div>
        </div>
    </div>

    <!-- PAYMENT HISTORY POPUP (Bottom Sheet) -->
    <div id="payment-sheet" class="bottom-sheet-overlay" onclick="closeSheetOutside(event, 'payment-sheet')">
        <div class="bottom-sheet" id="payment-sheet-content">
            <div class="sheet-header" id="payment-header">
                <div class="drag-handle-area"><div class="drag-handle"></div></div>
                <div class="sheet-title">Payment History</div>
            </div>
            
            <div class="sheet-content" id="payment-list-container">
                <!-- Payment History Cards will render here -->
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const urlParams = new URLSearchParams(window.location.search);
    const currentCode = urlParams.get('code');
    let globalStudentData = null;

    if(!currentCode) {
        alert("No student selected!");
        window.location.replace("index.html");
    }

    auth.onAuthStateChanged((user) => {
        if (!user) window.location.replace("login.html"); 
        else loadProfile();
    });

    function getDaysLeft(dateStr) {
        let today = new Date(); today.setHours(0,0,0,0);
        let target = new Date(dateStr);
        return Math.ceil((target - target.getTimezoneOffset()*60000 - today) / (1000 * 60 * 60 * 24));
    }

    function loadProfile() {
        db.collection("students").doc(currentCode).onSnapshot((doc) => {
            if(!doc.exists) return; 
            
            let stu = doc.data();
            globalStudentData = stu;

            document.getElementById("profile-header").style.display = "block";
            document.getElementById("prof-img").src = stu.photo; 
            document.getElementById("prof-name").innerText = stu.name; 
            document.getElementById("prof-room").innerText = `Room: ${stu.room} | Code: ${stu.code}`;
            
            let days = getDaysLeft(stu.feeValidTill);
            let badge = document.getElementById("prof-days");
            let pBtn = document.getElementById("btn-pause");
            
            if(stu.status === 'banned') { 
                badge.innerText = `BANNED`; badge.className = "badge-main expired"; pBtn.style.display="none";
            } else if(stu.status === 'paused') { 
                badge.innerText = `PAUSED (On Leave)`; badge.className = "badge-main paused-badge"; 
                pBtn.style.display="block"; pBtn.innerText="▶️ Resume"; pBtn.style.background="var(--success)"; 
            } else { 
                if(days >= 0) {
                    badge.innerText = `${days} Days Left`; badge.className = "badge-main";
                } else {
                    badge.innerText = `Expired (Due: ${Math.abs(days)} Days)`; badge.className = "badge-main expired";
                }
                pBtn.style.display="block"; pBtn.innerText="⏸️ Pause"; pBtn.style.background="var(--primary)"; 
            }

            loadCalendar(stu);
        });
    }

    // PAUSE LOGIC
    async function togglePause() {
        let stu = globalStudentData;
        let today = new Date();
        let todayStr = today.toISOString().split('T')[0];
        let pBtn = document.getElementById("btn-pause");
        pBtn.innerText = "⏳ Wait...";

        try {
            if(stu.status === 'paused') { 
                let pDate = new Date(stu.lastPauseDate); 
                let tDate = new Date(todayStr); 
                let daysPaused = 0;
                if(tDate >= pDate) { daysPaused = Math.floor((tDate - pDate)/(1000*60*60*24)); }
                
                let newExp = new Date(stu.feeValidTill); 
                newExp.setDate(newExp.getDate() + daysPaused);
                let hist = stu.pauseHistory || []; 
                hist.push({start: stu.lastPauseDate, end: todayStr});

                await db.collection("students").doc(currentCode).update({ 
                    status: 'active', lastPauseDate: null, pauseHistory: hist, feeValidTill: newExp.toISOString().split('T')[0] 
                });
                alert(`✅ Resumed! Expiry extended by ${daysPaused} days.`);
            } else { 
                let tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1); 
                let tomorrowStr = tomorrow.toISOString().split('T')[0];
                await db.collection("students").doc(currentCode).update({ status: 'paused', lastPauseDate: tomorrowStr });
                alert("⏸️ Account Paused! Pause will apply from TOMORROW.");
            }
        } catch(error) {
            alert("❌ Error: " + error.message);
        }
    }

    // --- PAYMENT HISTORY & EDIT SHEETS ---
    function openSheet(id) {
        if(id === 'edit-sheet') {
            let stu = globalStudentData;
            document.getElementById("edit-name").value = stu.name; 
            document.getElementById("edit-room").value = stu.room;
            document.getElementById("edit-date").value = stu.feeValidTill; 
            document.getElementById("edit-status").value = stu.status;
            document.getElementById("edit-pay-amt").value = ""; // Clear for new entry
        }

        history.pushState({ modal: id }, id, "#" + id);
        document.getElementById(id).classList.add('active'); 
        document.body.classList.add('modal-open'); 
    }

    function closeSheet(id) {
        if(history.state && history.state.modal === id) { history.back(); } 
        else { 
            document.getElementById(id).classList.remove('active'); 
            document.body.classList.remove('modal-open'); 
        }
    }

    function closeSheetOutside(e, id) { if(e.target.id === id) { closeSheet(id); } }

    window.addEventListener('popstate', function(event) {
        document.getElementById('edit-sheet').classList.remove('active');
        document.getElementById('payment-sheet').classList.remove('active');
        document.body.classList.remove('modal-open');
    });

    function setupSwipeToClose(sheetOverlayId, sheetContentId, headerId) {
        const sheet = document.getElementById(sheetContentId);
        const header = document.getElementById(headerId);
        let startY = 0, currentY = 0, isDragging = false;

        header.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; isDragging = true; sheet.style.transition = 'none'; }, {passive: true});
        header.addEventListener('touchmove', (e) => {
            if (!isDragging) return; currentY = e.touches[0].clientY; let deltaY = currentY - startY;
            if (deltaY > 0) { e.preventDefault(); sheet.style.transform = `translateY(${deltaY}px)`; }
        }, {passive: false});
        header.addEventListener('touchend', () => {
            if (!isDragging) return; isDragging = false; sheet.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1)';
            let deltaY = currentY - startY;
            if (deltaY > 60) { closeSheet(sheetOverlayId); setTimeout(() => { sheet.style.transform = ''; }, 400); } 
            else { sheet.style.transform = ''; }
        });
    }

    setupSwipeToClose('edit-sheet', 'edit-sheet-content', 'edit-header');
    setupSwipeToClose('payment-sheet', 'payment-sheet-content', 'payment-header');

    // --- PAYMENT HISTORY RENDERER ---
    function openPaymentHistory() {
        let hist = globalStudentData.paymentHistory || [];
        
        // Auto Migration: Agar old student hai jiska history nahi bana par initial payment kiya tha
        if(hist.length === 0 && globalStudentData.paymentAmount && parseInt(globalStudentData.paymentAmount) > 0) {
            let sd = new Date(globalStudentData.startDate || new Date());
            hist.push({
                dateAdded: globalStudentData.startDate || new Date().toISOString().split('T')[0],
                day: sd.toLocaleDateString('en-US', {weekday: 'long'}),
                amount: globalStudentData.paymentAmount,
                mode: globalStudentData.paymentMode || 'Cash',
                validTill: globalStudentData.feeValidTill
            });
        }

        let container = document.getElementById("payment-list-container");
        container.innerHTML = "";

        if(hist.length === 0) {
            container.innerHTML = "<div style='text-align:center; padding:30px; color:#888; font-weight:600;'>No payments recorded yet.</div>";
        } else {
            // Sort history - latest on top
            let sortedHist = hist.sort((a,b) => new Date(b.dateAdded) - new Date(a.dateAdded));
            
            sortedHist.forEach(p => {
                let d = new Date(p.dateAdded);
                let dateFormatted = d.toLocaleDateString('en-US', {day:'2-digit', month:'short', year:'numeric'});
                let v = new Date(p.validTill);
                let validFormatted = v.toLocaleDateString('en-US', {day:'2-digit', month:'short', year:'numeric'});

                container.innerHTML += `
                    <div class="pay-card">
                        <div class="pay-card-header">
                            <span class="pay-amt">₹${p.amount}</span>
                            <span class="pay-mode">${p.mode}</span>
                        </div>
                        <div class="pay-row"><span>Date Paid:</span> <strong>${dateFormatted} (${p.day})</strong></div>
                        <div class="pay-row"><span>Extended Till:</span> <strong>${validFormatted}</strong></div>
                    </div>
                `;
            });
        }
        openSheet('payment-sheet');
    }


    // --- UPDATE PROFILE & PAYMENT LOGIC ---
    function previewFile(inputId, displayId) { let file = document.getElementById(inputId).files[0]; if(file) document.getElementById(displayId).innerText = "✅ " + file.name; }
    function compressImage(file) {
        return new Promise((resolve) => {
            let reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = e => {
                let img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    let cvs = document.createElement('canvas'); cvs.width = 200; cvs.height = 200;
                    let minSize = Math.min(img.width, img.height);
                    let sx = (img.width - minSize) / 2, sy = (img.height - minSize) / 2;
                    cvs.getContext('2d').drawImage(img, sx, sy, minSize, minSize, 0, 0, 200, 200);
                    resolve(cvs.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    async function updateProfile() {
        let btn = document.getElementById("btn-save");
        btn.innerText = "⏳ Saving..."; btn.disabled = true;

        try {
            let uName = document.getElementById("edit-name").value, uRoom = document.getElementById("edit-room").value;
            let uDate = document.getElementById("edit-date").value, uStatus = document.getElementById("edit-status").value;
            let payAmt = document.getElementById("edit-pay-amt").value, payMode = document.getElementById("edit-pay-mode").value;
            
            let finalPhoto = globalStudentData.photo; 
            let file = document.getElementById("edit-photo").files[0]; 
            if(file) finalPhoto = await compressImage(file); 

            // PAYMENT HISTORY MANAGEMENT
            let hist = globalStudentData.paymentHistory || [];
            if(hist.length === 0 && globalStudentData.paymentAmount && parseInt(globalStudentData.paymentAmount) > 0) {
                let sd = new Date(globalStudentData.startDate || new Date());
                hist.push({ dateAdded: globalStudentData.startDate || new Date().toISOString().split('T')[0], day: sd.toLocaleDateString('en-US', {weekday: 'long'}), amount: globalStudentData.paymentAmount, mode: globalStudentData.paymentMode || 'Cash', validTill: globalStudentData.feeValidTill });
            }
            if(payAmt && parseInt(payAmt) > 0) {
                let today = new Date();
                hist.push({ dateAdded: today.toISOString().split('T')[0], day: today.toLocaleDateString('en-US', {weekday: 'long'}), amount: payAmt, mode: payMode, validTill: uDate });
            }
            
            await db.collection("students").doc(currentCode).update({ name: uName, room: uRoom, feeValidTill: uDate, status: uStatus, photo: finalPhoto, paymentHistory: hist });
            closeSheet('edit-sheet'); 
        } catch(error) {
            alert("❌ Failed to update: " + error.message);
        } finally {
            btn.innerText = "💾 Save Changes & Payment"; btn.disabled = false;
        }
    }

    async function deleteStudent() {
        if(confirm("⚠️ WARNING: Kya aap sach mein is student ka pura record DELETE karna chahte hain?")) {
            document.getElementById("btn-del").innerText = "🗑️ Deleting...";
            try {
                await db.collection("students").doc(currentCode).delete();
                window.location.replace("index.html"); 
            } catch(error) { alert("❌ Delete Error: " + error.message); document.getElementById("btn-del").innerText = "🗑️ Delete Student"; }
        }
    }

    function isDatePaused(dateStr, stu) {
        let d = new Date(dateStr);
        if(stu.lastPauseDate && d >= new Date(stu.lastPauseDate)) return true;
        if(stu.pauseHistory) { for(let h of stu.pauseHistory) { if(d >= new Date(h.start) && d < new Date(h.end)) return true; } }
        return false;
    }

    async function loadCalendar(stu) {
        let todayDate = new Date(), year = todayDate.getFullYear(), month = String(todayDate.getMonth() + 1).padStart(2, '0'), daysInMonth = todayDate.getDate(); 
        let logs = {};
        const snap = await db.collection("attendance").where("code", "==", stu.code).get();

        snap.forEach(doc => { 
            let d = doc.data(); 
            if(d.date.startsWith(`${year}-${month}`)) { if(!logs[d.date]) logs[d.date] = {}; logs[d.date][d.meal.toLowerCase()] = {isDue: d.isDue}; } 
        });

        let html = "";
        for(let i = daysInMonth; i >= 1; i--) {
            let dateStr = `${year}-${month}-${String(i).padStart(2, '0')}`;
            let dLog = logs[dateStr] || {}, isP = isDatePaused(dateStr, stu);
            
            let formatMeal = (mCode, label) => {
                if(dLog[mCode]) return dLog[mCode].isDue ? `due">⚠️ ${label}` : `yes">✔ ${label}`;
                return isP ? `pause">⏸ ${label}` : `no">❌ ${label}`;
            };

            let b = formatMeal('breakfast', 'B'), l = formatMeal('lunch', 'L'), d = formatMeal('dinner', 'D');
            let dateDisplay = new Date(dateStr).toLocaleDateString('en-US', {month:'short', day:'numeric'});
            html += `<div class="cal-row"><div class="cal-date">${dateDisplay}</div><div class="meal-dots"><div class="dot ${b}</div><div class="dot ${l}</div><div class="dot ${d}</div></div></div>`;
        }
        document.getElementById("cal-body").innerHTML = html;
    }
</script>
</body>
</html>
