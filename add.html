<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBC Mess - Add Student</title>

    <!-- 🔥 PWA & PREMIUM META TAGS 🔥 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f6f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OBC Mess">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --success: #34C759; --danger: #FF3B30; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 120px; }

        /* Loader */
        #app-loader { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;}
        .spinner { border: 4px solid rgba(0, 122, 255, 0.2); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header */
        .header { padding: 30px 20px 15px 20px; text-align: center; position: sticky; top: 0; background: rgba(244,246,249,0.95); backdrop-filter: blur(15px); z-index: 50; }
        .header p { margin: 0; font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;}
        .header h1 { margin: 2px 0 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;}

        /* Form Card */
        .form-card { background: var(--card-bg); margin: 0 20px; border-radius: 24px; padding: 25px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02);}
        
        /* Photo Upload UI (Matches Screenshot) */
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;}
        
        .photo-preview-box { width: 100%; height: 70px; border-radius: 16px; border: 2px dashed var(--primary); background: rgba(0,122,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; position: relative; overflow: hidden;}
        .photo-preview-box img { position: absolute; width: 100%; height: 100%; object-fit: cover; display: none; }
        .photo-preview-box.has-image img { display: block; }
        .photo-preview-box.has-image span { display: none; }
        #photo-input { display: none; }

        /* Grid Layouts */
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Inputs */
        .form-input { width: 100%; padding: 16px; border-radius: 16px; border: 2px solid transparent; background: #f4f6f9; font-size: 15px; font-weight: 600; color: var(--text-main); outline: none; transition: 0.2s; font-family: inherit;}
        .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 4px 15px rgba(0,122,255,0.1);}
        select.form-input { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 15px center; background-size: 15px; padding-right: 40px;}

        /* Dynamic Days Banner (Matches Screenshot) */
        .days-banner { display: none; background: #e8f5e9; border: 1px dashed #4caf50; border-radius: 12px; padding: 12px; text-align: center; color: #2e7d32; font-weight: 700; font-size: 14px; margin-bottom: 18px;}

        /* Password Specific */
        .pass-notice { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 6px; display: block;}

        .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(0,122,255,0.25); margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-submit:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(0,122,255,0.15);}
        .btn-submit:disabled { background: #a1c9f7; cursor: not-allowed; transform: none; box-shadow: none;}

        /* 🔥 5-TAB BOTTOM NAV 🔥 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 12px 5px 25px 5px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.2s; flex: 1;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; transition: transform 0.2s;}
        .nav-item:active .nav-icon { transform: scale(0.8); }
    </style>
</head>
<body>

    <div id="app-loader"><div class="spinner"></div></div>

    <div class="header">
        <p>Registration</p>
        <h1>Add Student</h1>
    </div>

    <div class="form-card">
        
        <!-- Photo Upload -->
        <div class="input-group">
            <label>Student Photo</label>
            <label for="photo-input" class="photo-preview-box" id="photo-preview-box">
                <span>📸 Tap to Open Camera</span>
                <img id="preview-img" src="">
            </label>
            <input type="file" id="photo-input" accept="image/*" onchange="compressAndPreview(event)">
        </div>

        <div class="row-2">
            <div class="input-group">
                <label>Code (ID)</label>
                <input type="number" id="s-code" class="form-input" placeholder="101" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Room No</label>
                <input type="text" id="s-room" class="form-input" placeholder="A-12" autocomplete="off">
            </div>
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="s-name" class="form-input" placeholder="Student Name" autocomplete="off">
        </div>

        <div class="row-2">
            <div class="input-group">
                <label>Start Date</label>
                <input type="date" id="s-start" class="form-input" onchange="calculateDays()">
            </div>
            <div class="input-group">
                <label>Valid Till</label>
                <input type="date" id="s-date" class="form-input" onchange="calculateDays()">
            </div>
        </div>

        <!-- Dynamic Days Calculation Banner -->
        <div id="days-banner" class="days-banner">
            <span id="days-text">☑ Registration for 0 Days</span>
        </div>

        <div class="row-2">
            <div class="input-group">
                <label>Amount (₹)</label>
                <input type="number" id="s-amount" class="form-input" placeholder="e.g. 2500" autocomplete="off">
            </div>
            <div class="input-group">
                <label>Pay Mode</label>
                <select id="s-paymode" class="form-input">
                    <option value="Cash">💵 Cash</option>
                    <option value="UPI">📱 UPI</option>
                    <option value="Bank">🏦 Bank</option>
                </select>
            </div>
        </div>

        <!-- 🔥 NEW PASSWORD FIELD 🔥 -->
        <div class="input-group">
            <label>Login Password</label>
            <input type="text" id="s-pass" class="form-input" placeholder="e.g. Akhand*276142#" autocomplete="off">
            <span class="pass-notice">Student can use this to login to their portal.</span>
        </div>

        <button class="btn-submit" id="btn-save" onclick="saveStudent()">💾 Save Student Record</button>
    </div>

    <!-- 🔥 5-TAB BOTTOM NAV 🔥 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div><span>Home</span>
        </a>
        <a href="add.html" class="nav-item active">
            <div class="nav-icon">➕</div><span>Add</span>
        </a>
        <a href="notification.html" class="nav-item">
            <div class="nav-icon">🔔</div><span>Alerts</span>
        </a>
        <a href="adminmeal.html" class="nav-item">
            <div class="nav-icon">🍽️</div><span>Menu</span>
        </a>
        <a href="setting.html" class="nav-item">
            <div class="nav-icon">⚙️</div><span>Settings</span>
        </a>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let compressedImageBase64 = "";

    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.replace("login.html"); } 
        else { document.getElementById("app-loader").style.display = "none"; }
    });

    // Smart Auto-Calculate Days
    function calculateDays() {
        let start = document.getElementById('s-start').value;
        let end = document.getElementById('s-date').value;
        let banner = document.getElementById('days-banner');
        let text = document.getElementById('days-text');
        
        if(start && end) {
            let d1 = new Date(start);
            let d2 = new Date(end);
            let diffTime = d2 - d1;
            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if(diffDays > 0) {
                banner.style.display = 'block';
                text.innerText = `☑ Registration for ${diffDays} Days`;
            } else {
                banner.style.display = 'none';
            }
        } else {
            banner.style.display = 'none';
        }
    }

    // Image Compressor
    function compressAndPreview(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                
                let MAX_SIZE = 400;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                compressedImageBase64 = canvas.toDataURL("image/jpeg", 0.7);

                document.getElementById("preview-img").src = compressedImageBase64;
                document.getElementById("photo-preview-box").classList.add("has-image");
            };
        };
        reader.readAsDataURL(file);
    }

    // Save All Data to Firebase
    async function saveStudent() {
        let name = document.getElementById("s-name").value.trim();
        let code = document.getElementById("s-code").value.trim();
        let room = document.getElementById("s-room").value.trim();
        let startDate = document.getElementById("s-start").value;
        let validDate = document.getElementById("s-date").value;
        let amount = document.getElementById("s-amount").value.trim();
        let payMode = document.getElementById("s-paymode").value;
        let password = document.getElementById("s-pass").value.trim();
        let btn = document.getElementById("btn-save");

        if(!name || !code || !room || !startDate || !validDate || !amount || !password) {
            return alert("⚠️ Please fill all details properly.");
        }
        if(!compressedImageBase64) {
            return alert("⚠️ Please upload a student photo.");
        }

        btn.innerText = "⏳ Saving Data..."; btn.disabled = true;

        try {
            let docCheck = await db.collection("students").doc(code).get();
            if(docCheck.exists) {
                alert(`❌ A student with Code ${code} already exists!`);
                btn.innerHTML = "💾 Save Student Record"; btn.disabled = false;
                return;
            }

            // Save full record
            await db.collection("students").doc(code).set({
                name: name,
                code: code,
                room: room,
                photo: compressedImageBase64,
                startDate: startDate,
                feeValidTill: validDate,
                amountPaid: amount,
                paymentMode: payMode,
                password: password,
                status: "active",
                isGuest: false,
                addedOn: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("✅ Student added successfully!");
            
            // Reload page to clear form cleanly
            window.location.reload();

        } catch (error) {
            alert("❌ Error: " + error.message);
            btn.innerHTML = "💾 Save Student Record"; btn.disabled = false;
        }
    }
</script>

<!-- 🔥 REGISTER SERVICE WORKER 🔥 -->
<script>
    if ('serviceWorker' in navigator) { 
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('sw.js'); 
        }); 
    }
</script>
</body>
</html>
