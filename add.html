<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBC Mess - Add Student</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged((user) => { if (!user) window.location.replace("login.html"); });
    </script>
    <style>
        /* PREMIUM BASE STYLES */
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --success: #34C759; --danger: #FF3B30; --warning: #FF9500; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 90px; }
        body.modal-open { overflow: hidden; overscroll-behavior-y: none; }

        .header { padding: 30px 20px 15px 20px; text-align: center; }
        .header p { margin: 0; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .header h1 { margin: 2px 0 0 0; font-size: 28px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;}

        /* GUEST BANNER */
        .guest-banner { background: linear-gradient(135deg, #1c1c1e, #2c2c2e); margin: 0 20px 20px 20px; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.2s; }
        .guest-banner:active { transform: scale(0.97); }
        .guest-icon { font-size: 32px; margin-right: 15px; background: rgba(255,255,255,0.1); width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; border-radius: 14px;}
        .guest-text { flex: 1; }
        .guest-text h4 { color: #fff; margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 0.5px;}
        .guest-text p { color: #aaa; margin: 3px 0 0 0; font-size: 12px; font-weight: 600;}
        .guest-arrow { color: #888; font-weight: bold; font-size: 18px; }

        /* FORM STYLES */
        .form-card { background: var(--card-bg); margin: 0 20px; border-radius: 24px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.04); }
        .input-group { margin-bottom: 18px; text-align: left; position: relative;}
        .input-group label { display: block; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;}
        .input-group input, .input-group select { width: 100%; background: var(--bg-color); border: 2px solid transparent; padding: 16px; border-radius: 14px; font-size: 16px; outline: none; font-weight: 600; color: var(--text-main); transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); background: #fff; }
        
        .upload-btn { background: rgba(0, 122, 255, 0.08); border: 2px dashed var(--primary); padding: 16px; border-radius: 14px; text-align: center; color: var(--primary); font-weight: 700; position: relative; margin-bottom: 5px;}
        .upload-btn input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;}
        
        #days-info { display: none; padding: 12px; border-radius: 12px; background: rgba(52, 199, 89, 0.1); color: var(--success); font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 18px; border: 1px dashed var(--success); animation: fadeIn 0.3s ease;}
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .btn-main { width: 100%; background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(0,122,255,0.25);}
        .btn-main:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(0,122,255,0.15);}
        .btn-main:disabled { opacity: 0.6; cursor: not-allowed; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 15px 0 25px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; transition: transform 0.2s; }
        .nav-item:active .nav-icon { transform: scale(0.8); }

        /* BOTTOM SHEET */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; backdrop-filter: blur(3px);}
        .bottom-sheet-overlay.active { opacity: 1; visibility: visible; }
        .bottom-sheet { position: absolute; bottom: 0; left: 0; width: 100%; background: var(--card-bg); border-radius: 30px 30px 0 0; padding: 0px 0px 20px 0px; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); z-index: 1001; max-height: 90vh; display: flex; flex-direction: column;}
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }
        .sheet-header { padding: 15px 25px 15px 25px; background: var(--card-bg); border-radius: 30px 30px 0 0; position: sticky; top: 0; z-index: 10; touch-action: none; border-bottom: 1px solid rgba(0,0,0,0.05);}
        .drag-handle-area { width: 100%; height: 20px; display: flex; justify-content: center; align-items: flex-start; cursor: grab; padding-top: 5px; margin-bottom: 5px;}
        .drag-handle { width: 45px; height: 5px; background: #d1d1d6; border-radius: 5px; }
        .sheet-title { font-size: 20px; font-weight: 800; text-align: center; color: var(--text-main); margin: 0; }
        .sheet-content { padding: 15px 25px; overflow-y: auto; flex-grow: 1; overscroll-behavior: contain; }
    </style>
</head>
<body>

    <div class="header">
        <p>Registration</p>
        <h1>Add Entry</h1>
    </div>

    <!-- GUEST ENTRY BANNER -->
    <div class="guest-banner" onclick="openSheet('guest-sheet')">
        <div class="guest-icon">🏃</div>
        <div class="guest-text">
            <h4>Quick Guest Pass</h4>
            <p>For parents, 1-day visits & single meals</p>
        </div>
        <div class="guest-arrow">❯</div>
    </div>

    <div class="form-card">
        <h3 style="margin: 0 0 20px 0; font-size: 16px; color: var(--text-main); border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;">Regular Student</h3>
        
        <div class="input-group">
            <label>Student Photo</label>
            <div class="upload-btn">
                <span id="file-name">📸 Tap to Open Camera</span>
                <input type="file" id="stu-photo" accept="image/*" capture="environment" onchange="previewFile('stu-photo', 'file-name')">
            </div>
        </div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="input-group">
                <label>Code (ID)</label>
                <!-- 🔥 NEW: onkeyup event added for live checking -->
                <input type="text" id="stu-code" placeholder="101" onkeyup="checkCodeAvailability()" required>
                <!-- 🔥 NEW: Warning message div -->
                <div id="code-warning" style="display:none; color: var(--danger); font-size: 12px; margin-top: 6px; font-weight: 800; background: rgba(255,59,48,0.1); padding: 4px 8px; border-radius: 6px;">⚠️ Code Reserved!</div>
            </div>
            <div class="input-group"><label>Room No</label><input type="text" id="stu-room" placeholder="A-12" required></div>
        </div>
        <div class="input-group"><label>Full Name</label><input type="text" id="stu-name" placeholder="Student Name" required></div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="input-group"><label>Start Date</label><input type="date" id="stu-start" onchange="calculateDays()" required></div>
            <div class="input-group"><label>Valid Till</label><input type="date" id="stu-date" onchange="calculateDays()" required></div>
        </div>

        <div id="days-info"></div>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="input-group"><label>Amount (₹)</label><input type="number" id="stu-amount" placeholder="e.g. 2500"></div>
            <div class="input-group">
                <label>Pay Mode</label>
                <select id="stu-pay-mode">
                    <option value="Cash">💵 Cash</option>
                    <option value="Online">📱 Online</option>
                </select>
            </div>
        </div>
        
        <button class="btn-main" id="btn-save" onclick="saveStudent(false)">💾 Save Regular Student</button>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div><span>Home</span></a>
        <a href="add.html" class="nav-item active"><div class="nav-icon">➕</div><span>Add New</span></a>
        <a href="setting.html" class="nav-item"><div class="nav-icon">⚙️</div><span>Settings</span></a>
    </div>

    <!-- GUEST POPUP SHEET -->
    <div id="guest-sheet" class="bottom-sheet-overlay" onclick="closeSheetOutside(event, 'guest-sheet')">
        <div class="bottom-sheet" id="guest-sheet-content">
            <div class="sheet-header" id="guest-header">
                <div class="drag-handle-area"><div class="drag-handle"></div></div>
                <div class="sheet-title">Guest / Temporary Pass</div>
            </div>
            
            <div class="sheet-content">
                <p style="font-size:12px; color:var(--text-muted); margin:0 0 15px 0;">No Code or Room required. Auto-expires safely.</p>
                
                <div class="input-group">
                    <label>Guest Photo (Optional)</label>
                    <div class="upload-btn">
                        <span id="g-file-name">📸 Tap to Open Camera</span>
                        <input type="file" id="g-photo" accept="image/*" capture="environment" onchange="previewFile('g-photo', 'g-file-name')">
                    </div>
                </div>

                <div class="input-group">
                    <label>Guest Name / Details</label>
                    <input type="text" id="g-name" placeholder="e.g. Rahul's Father (Guest)">
                </div>

                <div class="input-group">
                    <label>Pass Duration</label>
                    <select id="g-duration" onchange="handleGuestDuration()">
                        <option value="meal_breakfast">🍽️ 1 Meal (Breakfast)</option>
                        <option value="meal_lunch">🍽️ 1 Meal (Lunch)</option>
                        <option value="meal_dinner">🍽️ 1 Meal (Dinner)</option>
                        <option value="2meals">🍽️ 2 Meals (e.g. Lunch & Dinner)</option>
                        <option value="1day">📅 1 Full Day (Today)</option>
                        <option value="2days">📅 2 Full Days</option>
                        <option value="3days">📅 3 Full Days</option>
                        <option value="custom">⚙️ Custom Dates...</option>
                    </select>
                </div>

                <div id="g-custom-dates" style="display:none; grid-template-columns:1fr 1fr; gap:10px;">
                    <div class="input-group"><label>Start</label><input type="date" id="g-start-date"></div>
                    <div class="input-group"><label>Valid Till</label><input type="date" id="g-end-date"></div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <div class="input-group"><label>Amount (₹)</label><input type="number" id="g-amount" placeholder="e.g. 50"></div>
                    <div class="input-group">
                        <label>Pay Mode</label>
                        <select id="g-pay-mode">
                            <option value="Cash">💵 Cash</option>
                            <option value="Online">📱 Online</option>
                        </select>
                    </div>
                </div>
                
                <button class="btn-main" style="background:#1c1c1e;" id="btn-g-save" onclick="saveStudent(true)">⚡ Generate Pass</button>
            </div>
        </div>
    </div>

<script>
    const db = firebase.firestore();

    document.getElementById("stu-start").value = new Date().toISOString().split('T')[0];
    
    // 🔥 LIVE CODE VALIDATION LOGIC 🔥
    let isCodeTaken = false;
    async function checkCodeAvailability() {
        let codeInput = document.getElementById("stu-code").value.trim();
        let warningMsg = document.getElementById("code-warning");
        
        if(!codeInput) {
            warningMsg.style.display = "none";
            isCodeTaken = false;
            document.getElementById("stu-code").style.borderColor = "transparent";
            return;
        }

        try {
            let doc = await db.collection("students").doc(codeInput).get();
            if(doc.exists) {
                warningMsg.style.display = "inline-block";
                document.getElementById("stu-code").style.borderColor = "var(--danger)";
                isCodeTaken = true;
            } else {
                warningMsg.style.display = "none";
                document.getElementById("stu-code").style.borderColor = "var(--success)";
                isCodeTaken = false;
            }
        } catch(e) { console.error("Validation Error:", e); }
    }

    function calculateDays() {
        let startVal = document.getElementById("stu-start").value; let endVal = document.getElementById("stu-date").value;
        let infoBox = document.getElementById("days-info");

        if(startVal && endVal) {
            let sDate = new Date(startVal); let eDate = new Date(endVal);
            let diffTime = eDate.getTime() - sDate.getTime();
            let diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;

            infoBox.style.display = "block";
            if(diffDays > 0) {
                infoBox.style.background = "rgba(52, 199, 89, 0.1)"; infoBox.style.borderColor = "var(--success)";
                infoBox.innerHTML = `✅ Registration for <span style="font-size:16px; color:var(--success);">${diffDays} Days</span>`;
            } else {
                infoBox.style.background = "rgba(255, 59, 48, 0.1)"; infoBox.style.borderColor = "var(--danger)";
                infoBox.innerHTML = `❌ Invalid Dates <span style="font-size:16px; color:var(--danger);">(${diffDays} Days)</span>`;
            }
        } else { infoBox.style.display = "none"; }
    }

    function previewFile(inputId, displayId) {
        let file = document.getElementById(inputId).files[0];
        if(file) document.getElementById(displayId).innerText = "✅ " + file.name;
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            let reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = e => {
                let img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    let cvs = document.createElement('canvas'); cvs.width = 200; cvs.height = 200;
                    let minSize = Math.min(img.width, img.height);
                    let sx = (img.width - minSize) / 2; let sy = (img.height - minSize) / 2;
                    cvs.getContext('2d').drawImage(img, sx, sy, minSize, minSize, 0, 0, 200, 200);
                    resolve(cvs.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    function openSheet(id) { history.pushState({ modal: id }, id, "#" + id); document.getElementById(id).classList.add('active'); document.body.classList.add('modal-open'); }
    function closeSheet(id) { if(history.state && history.state.modal === id) { history.back(); } else { document.getElementById(id).classList.remove('active'); document.body.classList.remove('modal-open'); } }
    function closeSheetOutside(e, id) { if(e.target.id === id) { closeSheet(id); } }
    window.addEventListener('popstate', function() { document.getElementById('guest-sheet').classList.remove('active'); document.body.classList.remove('modal-open'); });

    function setupSwipeToClose(sheetOverlayId, sheetContentId, headerId) {
        const sheet = document.getElementById(sheetContentId); const header = document.getElementById(headerId);
        let startY = 0, currentY = 0, isDragging = false;
        header.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; isDragging = true; sheet.style.transition = 'none'; }, {passive: true});
        header.addEventListener('touchmove', (e) => { if (!isDragging) return; currentY = e.touches[0].clientY; let deltaY = currentY - startY; if (deltaY > 0) { e.preventDefault(); sheet.style.transform = `translateY(${deltaY}px)`; } }, {passive: false});
        header.addEventListener('touchend', () => { if (!isDragging) return; isDragging = false; sheet.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1)'; let deltaY = currentY - startY; if (deltaY > 60) { closeSheet(sheetOverlayId); setTimeout(() => { sheet.style.transform = ''; }, 400); } else { sheet.style.transform = ''; } });
    }
    setupSwipeToClose('guest-sheet', 'guest-sheet-content', 'guest-header');

    function handleGuestDuration() {
        let val = document.getElementById('g-duration').value;
        if(val === 'custom') { document.getElementById('g-custom-dates').style.display = 'grid'; document.getElementById('g-start-date').value = new Date().toISOString().split('T')[0]; } 
        else { document.getElementById('g-custom-dates').style.display = 'none'; }
    }

    // --- MASTER SAVE LOGIC ---
    async function saveStudent(isGuest) {
        let code, name, room, dateFrom, dateTo, payMode, amt, file, btn, passType;

        if (isGuest) {
            name = document.getElementById("g-name").value.trim();
            if(!name) return alert("⚠️ Guest Name / Detail is required!");
            
            // 🔥 GUEST CODE SAFETY CHECK
            let unique = false;
            while(!unique) {
                code = "G" + Math.floor(1000 + Math.random() * 9000); 
                let checkSnap = await db.collection("students").doc(code).get();
                if(!checkSnap.exists) unique = true;
            }
            room = "Guest";
            
            let dur = document.getElementById("g-duration").value;
            let sDate = new Date(); let eDate = new Date();
            passType = dur; 
            
            if(dur.startsWith('meal_') || dur === '2meals' || dur === '1day') { eDate = new Date(); } 
            else if(dur === '2days') { eDate.setDate(sDate.getDate() + 1); } 
            else if(dur === '3days') { eDate.setDate(sDate.getDate() + 2); } 
            else if(dur === 'custom') {
                sDate = new Date(document.getElementById('g-start-date').value);
                eDate = new Date(document.getElementById('g-end-date').value);
            }
            
            dateFrom = sDate.toISOString().split('T')[0];
            dateTo = eDate.toISOString().split('T')[0];
            
            amt = document.getElementById("g-amount").value;
            payMode = document.getElementById("g-pay-mode").value;
            file = document.getElementById("g-photo").files[0];
            
            btn = document.getElementById("btn-g-save");
            btn.innerText = "⏳ Generating...";

        } else {
            // REGULAR STUDENT
            // 🔥 STOP SAVING IF CODE IS TAKEN
            if(isCodeTaken) {
                return alert("❌ Cannot Save! The Code (ID) you entered is already reserved for another student.");
            }

            code = document.getElementById("stu-code").value.trim();
            name = document.getElementById("stu-name").value.trim();
            room = document.getElementById("stu-room").value.trim();
            dateFrom = document.getElementById("stu-start").value;
            dateTo = document.getElementById("stu-date").value;
            passType = "regular";
            
            if(!code || !name || !dateTo) return alert("⚠️ Code, Name and Valid Till Date are required!");
            
            // Double check safety before pushing to DB
            let finalCheck = await db.collection("students").doc(code).get();
            if(finalCheck.exists) {
                document.getElementById("code-warning").style.display = "inline-block";
                document.getElementById("stu-code").style.borderColor = "var(--danger)";
                isCodeTaken = true;
                return alert("❌ Cannot Save! The Code (ID) you entered is already reserved.");
            }

            let sDate = new Date(dateFrom); let eDate = new Date(dateTo);
            if(eDate < sDate) return alert("❌ Invalid Date! 'Valid Till' pehle ki date nahi ho sakti.");
            
            amt = document.getElementById("stu-amount").value;
            payMode = document.getElementById("stu-pay-mode").value;
            file = document.getElementById("stu-photo").files[0];
            
            btn = document.getElementById("btn-save");
            btn.innerText = "⏳ Saving...";
        }

        btn.style.opacity = "0.7"; btn.disabled = true;

        let photoUrl = `https://ui-avatars.com/api/?name=${name}&background=random&color=fff&size=200`;
        if(file) { photoUrl = await compressImage(file); }
        
        let paymentHist = [];
        if(amt && parseInt(amt) > 0) {
            let dStr = new Date().toISOString().split('T')[0];
            let dayStr = new Date().toLocaleDateString('en-US', {weekday: 'long'});
            paymentHist.push({ dateAdded: dStr, day: dayStr, amount: amt, mode: payMode, validTill: dateTo });
        }

        try {
            await db.collection("students").doc(code).set({ 
                code: code, name: name, room: room, startDate: dateFrom, feeValidTill: dateTo, 
                paymentMode: payMode, paymentAmount: amt || "0", photo: photoUrl, status: "active", 
                pauseHistory: [], paymentHistory: paymentHist, isGuest: isGuest, passType: passType 
            });
            
            if(isGuest) {
                alert(`✅ Guest Pass Generated!\n\nThe Access Code is: ${code}`);
            } else {
                alert("✅ Student Successfully Added!");
            }
            window.location.replace("index.html"); 
            
        } catch(error) {
            alert("❌ Error saving: " + error.message);
            btn.innerText = isGuest ? "⚡ Generate Pass" : "💾 Save Student Record";
            btn.style.opacity = "1"; btn.disabled = false;
        }
    }
</script>
</body>
</html>
