<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add Student - OBC Mess</title>

    <!-- 🔥 PWA & PREMIUM META TAGS 🔥 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f4f6f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OBC Mess">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1d1d1f; --text-muted: #86868b; --primary: #007AFF; --success: #34C759; --danger: #FF3B30; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 120px; }

        /* Loader */
        #app-loader { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:99999; display:flex; flex-direction:column; justify-content:center; align-items:center;}
        .spinner { border: 4px solid rgba(0, 122, 255, 0.2); border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Header */
        .header { padding: 30px 20px 15px 20px; position: sticky; top: 0; background: rgba(244,246,249,0.9); backdrop-filter: blur(15px); z-index: 50; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;}

        /* Form Card */
        .form-card { background: var(--card-bg); margin: 0 20px; border-radius: 24px; padding: 25px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02);}
        
        /* Photo Upload UI */
        .photo-upload-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 25px; }
        .photo-preview { width: 100px; height: 100px; border-radius: 25px; background: #f0f0f5; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #aaa; border: 2px dashed #d1d1d6; overflow: hidden; position: relative; cursor: pointer; transition: 0.2s;}
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .photo-preview.has-image { border-style: solid; border-color: var(--primary); }
        .photo-preview.has-image img { display: block; }
        .photo-preview.has-image span { display: none; }
        #photo-input { display: none; }
        .photo-label-text { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--primary); cursor: pointer;}

        /* Inputs */
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;}
        .form-input { width: 100%; padding: 16px 20px; border-radius: 16px; border: 2px solid transparent; background: #f4f6f9; font-size: 16px; font-weight: 600; color: var(--text-main); outline: none; transition: 0.2s;}
        .form-input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 4px 15px rgba(0,122,255,0.1);}
        
        /* Password Specific */
        .pass-notice { font-size: 11px; color: var(--warning); font-weight: 600; margin-top: 5px; display: block;}

        .btn-submit { width: 100%; background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(0,122,255,0.25); margin-top: 10px;}
        .btn-submit:active { transform: scale(0.97); box-shadow: 0 4px 10px rgba(0,122,255,0.15);}
        .btn-submit:disabled { background: #a1c9f7; cursor: not-allowed; transform: none; box-shadow: none;}

        /* 🔥 5-TAB BOTTOM NAV 🔥 */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-around; padding: 12px 5px 25px 5px; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.2s; flex: 1;}
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; transition: transform 0.2s;}
        .nav-item:active .nav-icon { transform: scale(0.8); }
    </style>
</head>
<body>

    <div id="app-loader"><div class="spinner"></div></div>

    <div class="header">
        <h1>Add New Student</h1>
    </div>

    <div class="form-card">
        <!-- Photo Upload -->
        <div class="photo-upload-container">
            <label for="photo-input" class="photo-preview" id="photo-preview-box">
                <span>📷</span>
                <img id="preview-img" src="">
            </label>
            <input type="file" id="photo-input" accept="image/*" onchange="compressAndPreview(event)">
            <label for="photo-input" class="photo-label-text">Tap to Upload Photo</label>
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="s-name" class="form-input" placeholder="e.g. Akhand Pratap Singh" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Mess Code (Unique)</label>
            <input type="number" id="s-code" class="form-input" placeholder="e.g. 101" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Room Number</label>
            <input type="text" id="s-room" class="form-input" placeholder="e.g. 310" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Fee Valid Till</label>
            <input type="date" id="s-date" class="form-input">
        </div>

        <!-- 🔥 NEW PASSWORD FIELD 🔥 -->
        <div class="input-group">
            <label>Login Password</label>
            <input type="text" id="s-pass" class="form-input" placeholder="Set initial password (e.g. 123456)" autocomplete="off">
            <span class="pass-notice">Student can change this later from their portal.</span>
        </div>

        <button class="btn-submit" id="btn-save" onclick="saveStudent()">Save Student Record</button>
    </div>

    <!-- 🔥 5-TAB BOTTOM NAV 🔥 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div><span>Home</span>
        </a>
        <a href="add.html" class="nav-item active">
            <div class="nav-icon">➕</div><span>Add</span>
        </a>
        <a href="notification.html" class="nav-item">
            <div class="nav-icon">🔔</div><span>Alerts</span>
        </a>
        <a href="adminmeal.html" class="nav-item">
            <div class="nav-icon">🍽️</div><span>Menu</span>
        </a>
        <a href="setting.html" class="nav-item">
            <div class="nav-icon">⚙️</div><span>Settings</span>
        </a>
    </div>

<script>
    // Firebase Config
    const firebaseConfig = { apiKey: "AIzaSyAA2P2IM5aPzJj10XMGLn_9BMSJhKeMGiE", authDomain: "obc-mess-system.firebaseapp.com", projectId: "obc-mess-system", storageBucket: "obc-mess-system.firebasestorage.app", messagingSenderId: "501219370424", appId: "1:501219370424:web:1dddaefc10e8bd21efdb4d" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let compressedImageBase64 = "";

    // Auth Check
    auth.onAuthStateChanged((user) => {
        if (!user) { window.location.replace("login.html"); } 
        else { document.getElementById("app-loader").style.display = "none"; }
    });

    // Image Compressor (To save database space and load fast)
    function compressAndPreview(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let img = new Image();
            img.src = e.target.result;
            img.onload = function() {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                
                // Max width/height
                let MAX_SIZE = 400;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                    if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }

                canvas.width = width; canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // Compress to WebP or JPEG
                compressedImageBase64 = canvas.toDataURL("image/jpeg", 0.7);

                // Show Preview
                document.getElementById("preview-img").src = compressedImageBase64;
                document.getElementById("photo-preview-box").classList.add("has-image");
            };
        };
        reader.readAsDataURL(file);
    }

    // Save Data to Firebase
    async function saveStudent() {
        let name = document.getElementById("s-name").value.trim();
        let code = document.getElementById("s-code").value.trim();
        let room = document.getElementById("s-room").value.trim();
        let validDate = document.getElementById("s-date").value;
        let password = document.getElementById("s-pass").value.trim();
        let btn = document.getElementById("btn-save");

        // Basic Validation
        if(!name || !code || !room || !validDate || !password) {
            return alert("⚠️ Please fill all fields including the password.");
        }
        if(!compressedImageBase64) {
            return alert("⚠️ Please upload a student photo.");
        }

        btn.innerText = "⏳ Saving..."; btn.disabled = true;

        try {
            // Check if Code already exists
            let docCheck = await db.collection("students").doc(code).get();
            if(docCheck.exists) {
                alert(`❌ A student with Code ${code} already exists! Please use a different code.`);
                btn.innerText = "Save Student Record"; btn.disabled = false;
                return;
            }

            // Save new student
            await db.collection("students").doc(code).set({
                name: name,
                code: code,
                room: room,
                photo: compressedImageBase64,
                feeValidTill: validDate,
                password: password, // 🔥 Saving the password
                status: "active",
                isGuest: false,
                addedOn: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("✅ Student added successfully!");
            
            // Clear form
            document.getElementById("s-name").value = "";
            document.getElementById("s-code").value = "";
            document.getElementById("s-room").value = "";
            document.getElementById("s-date").value = "";
            document.getElementById("s-pass").value = "";
            compressedImageBase64 = "";
            document.getElementById("photo-preview-box").classList.remove("has-image");
            document.getElementById("preview-img").src = "";
            
            btn.innerText = "Save Student Record"; btn.disabled = false;

        } catch (error) {
            alert("❌ Error saving record: " + error.message);
            btn.innerText = "Save Student Record"; btn.disabled = false;
        }
    }
</script>

<!-- 🔥 REGISTER SERVICE WORKER 🔥 -->
<script>
    if ('serviceWorker' in navigator) { 
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('PWA Active!'))
            .catch(err => console.log('SW Setup Failed', err)); 
        }); 
    }
</script>
</body>
</html>
